<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Vídeo">
  <!-- Capa genérica das matérias em VÍDEO: aparece na lista do Feed no lugar
       da foto, e é a imagem que sai no compartilhamento (og:image não aceita
       vídeo). Identidade da clínica: lavanda, violeta e o champagne. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1fd"/>
      <stop offset="1" stop-color="#e3ddfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#f)"/>
  <circle cx="450" cy="228" r="86" fill="#5b4fd8"/>
  <path d="M425 190 l64 38 -64 38 z" fill="#ffffff"/>
  <rect x="352" y="352" width="196" height="5" rx="2.5" fill="#c9a86a"/>
  <text x="450" y="330" text-anchor="middle" font-family="Figtree, Segoe UI, system-ui, sans-serif"
        font-size="34" font-weight="700" letter-spacing="6" fill="#3b3468">VÍDEO</text>
  <text x="450" y="392" text-anchor="middle" font-family="Figtree, Segoe UI, system-ui, sans-serif"
        font-size="19" fill="#6b6590">Clique para assistir</text>
</svg>
