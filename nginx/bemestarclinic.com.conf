# ==========================================================================
#  /etc/nginx/sites-available/bemestarclinic.com
#
#  Instalar:
#    sudo cp nginx/bemestarclinic.com.conf /etc/nginx/sites-available/bemestarclinic.com
#    sudo ln -s /etc/nginx/sites-available/bemestarclinic.com /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Depois rode o certbot (ele reescreve este arquivo acrescentando o bloco 443
#  e o redirecionamento). Não edite as linhas que o certbot inserir.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bemestarclinic.com www.bemestarclinic.com;

    # O painel envia foto em base64 dentro do JSON. O padrão do nginx é 1 MB —
    # sem isto, enviar uma foto de celular devolve 413 e o upload falha.
    # 25 MB é o mesmo teto que o server.js aplica.
    client_max_body_size 25m;

    access_log /var/log/nginx/bemestarclinic.access.log;
    error_log  /var/log/nginx/bemestarclinic.error.log;

    # Metadados de repositório nunca devem sair pela web. O server.js já bloqueia,
    # mas aqui a porta fecha antes mesmo de chegar na aplicação.
    location ~ /\.(git|env|gitignore) {
        deny all;
        return 404;
    }


    # ------------------------------------------------------------------
    #  Página de manutenção quando a APLICAÇÃO está fora do ar.
    #  O modo manutenção do painel cobre o caso do app rodando; isto cobre
    #  restart, deploy, git stash e queda — quando não há app para responder.
    #  Sem isto o visitante veria a tela cinza de "502 Bad Gateway".
    # ------------------------------------------------------------------
    error_page 502 503 504 /manutencao.html;
    location = /manutencao.html {
        root /var/www/projetos/BemEstarClinic;
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------
    #  O WEBSOCKET DO CHAT DA EQUIPE — precisa vir ANTES do `location /`
    #
    #  Sem este bloco o chat carrega, autentica, mostra as conversas e NUNCA
    #  recebe mensagem em tempo real. Nada aparece quebrado: o sintoma é
    #  "às vezes não chega", que é o pior tipo de defeito para diagnosticar.
    #
    #  Três coisas são obrigatórias aqui:
    #
    #  · `Upgrade` e `Connection` — o cabeçalho `Connection` é POR SALTO e
    #    precisa ser reescrito entre o nginx e o Node. O `$conexao_upgrade`
    #    vem do `map` em /etc/nginx/conf.d/lachat-upgrade.conf (copiado de
    #    LA-Chat/nginx/), que só escreve "upgrade" para quem pediu upgrade —
    #    fixar o valor mataria o keep-alive de todas as páginas do site.
    #
    #  · `proxy_read_timeout` longo — o padrão de 60 s derrubaria o socket
    #    ocioso. O chat manda ping a cada 25 s, então 60 s até sobreviveria,
    #    mas por margem apertada demais para uma conexão que fica aberta o
    #    expediente inteiro.
    #
    #  · o caminho `/restrito/chat/ws`, e não `/chat/ws`: o chat é montado
    #    DENTRO do /restrito, porque o cookie da gestão tem `Path=/restrito`.
    #
    #  Conferir depois de aplicar (o `-T` mostra o que está CARREGADO, e não
    #  só o que passou no teste de sintaxe):
    #      sudo nginx -T | grep -A6 'location /restrito/chat/ws'
    # ------------------------------------------------------------------
    location /restrito/chat/ws {
        proxy_pass http://127.0.0.1:5185;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexao_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering     off;
    }

    location / {
        proxy_pass http://127.0.0.1:5185;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sem estes dois a aplicação enxerga todo mundo como 127.0.0.1:
        # o contador de acessos contaria 1 visitante só, e o cookie de sessão
        # do painel não receberia a marca Secure.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
